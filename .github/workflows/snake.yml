   1 name: Generate Snake
   2
   3 on:
   4   schedule:
   5     - cron: "0 0 * * *" # runs daily at midnight UTC
   6   workflow_dispatch: # allows manual trigger from Actions tab
   7
   8 jobs:
   9   generate:
  10     runs-on: ubuntu-latest
  11     permissions:
  12       contents: write
  13     steps:
  14       - name: Generate snake SVGs
  15         uses: Platane/snk@v3
  16         with:
  17           github_user_name: VolodymyrM27
  18           outputs: |
  19             dist/github-snake.svg
  20             dist/github-snake-dark.svg?palette=github-dark
  21
  22       - name: Push to output branch
  23         uses: crazy-max/ghaction-github-pages@v3.1.0
  24         with:
  25           target_branch: output
  26           build_dir: dist
  27         env:
  28           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
